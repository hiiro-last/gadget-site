<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazonレビュー特化ブログ｜最新ガジェット・日用品・ファッションを実使用レビュー</title>
    <meta name="description" content="ガジェット・日用品・ファッションを中心に、実際に使って分かった魅力と弱点をレビュー。最新記事・注目記事・カテゴリ別に探しやすい構成でお届けします。">

    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #fafafa; }
        header { padding: 20px; background: #111; color: #fff; text-align: center; }
        h2 { margin: 30px 15px 10px; }
        .section { padding: 10px 15px; }
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 10px 0;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .card:hover { transform: translateY(-3px); }
        .card img { width: 100%; height: 120px; object-fit: cover; }
        .card-body { padding: 10px; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .card-desc { font-size: 12px; color: #555; }
        .badge-new {
            display: inline-block;
            background: #e60033;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }
        nav a { text-decoration: none; color: #333; font-weight: bold; }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>Amazonレビュー特化ブログ</h1>
    <p>実際に使って分かった魅力と弱点を正直レビュー</p>
</header>

<nav>
    <a href="index.html">新着</a>
    <a href="gadget.html">ガジェット</a>
    <a href="daily.html">日用品</a>
    <a href="other.html">その他</a>
    <a href="admin.html">作者</a>
</nav>

<div class="section" id="latest-section">
    <h2>🆕 新着記事</h2>
    <div class="articles-grid" id="latest-articles"></div>
</div>

<div class="section" id="featured-section">
    <h2>⭐ 注目記事</h2>
    <div class="articles-grid" id="featured-articles"></div>
</div>

<div class="section">
    <h2>📂 カテゴリ別</h2>

    <h3>ガジェット</h3>
    <div class="articles-grid" id="cat-gadget"></div>

    <h3>日用品</h3>
    <div class="articles-grid" id="cat-daily"></div>

    <h3>その他</h3>
    <div class="articles-grid" id="cat-other"></div>
</div>

<div class="section">
    <h2>📚 全記事一覧</h2>
    <div class="articles-grid" id="all-articles"></div>
</div>

<footer>
    © 2026 レビュー特化ブログ
</footer>

<script>
fetch("articles.json")
    .then(res => res.json())
    .then(articles => {

        // --- 新着記事 ---
        const latest = [...articles]
            .sort((a, b) => new Date(b.purchaseDate) - new Date(a.purchaseDate))
            .slice(0, 6);

        render("latest-articles", latest, true);

        // --- 注目記事 ---
        const featured = articles
            .filter(a => a.isFeatured)
            .sort((a, b) => b.priority - a.priority)
            .slice(0, 2);

        render("featured-articles", featured, false);

        // --- カテゴリ別 ---
        render("cat-gadget", getByCategory("gadget", articles), false);
        render("cat-daily", getByCategory("daily", articles), false);
        render("cat-other", getByCategory("other", articles), false);

        // --- 全記事 ---
        const all = [...articles]
            .sort((a, b) => new Date(b.purchaseDate) - new Date(a.purchaseDate));

        render("all-articles", all, false);
    });

function getByCategory(cat, articles) {
    return articles
        .filter(a => a.category === cat)
        .sort((a, b) => new Date(b.purchaseDate) - new Date(a.purchaseDate))
        .slice(0, 3);
}

function render(id, list, showNewBadge) {
    const container = document.getElementById(id);
    container.innerHTML = list.map(a => `
        <a href="${a.url}" class="card">
            <img src="${a.thumb}" alt="${a.title}">
            <div class="card-body">
                ${showNewBadge ? `<span class="badge-new">NEW</span>` : ""}
                <div class="card-title">${a.title}</div>
                <div class="card-desc">${a.description}</div>
            </div>
        </a>
    `).join("");
}
</script>

</body>
</html>
