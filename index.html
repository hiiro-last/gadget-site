<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gadget & Life All Hail Amazon｜Amazon購入品レビュー特化ブログ</title>

  <meta name="description" content="Gadget & Life All Hail Amazon は、Amazonで実際に購入したガジェット・日用品・ファッション・管理人特製記事を本音レビューするブログ。すべて自腹購入・実体験ベースで信頼性の高いレビューを掲載。">
  <meta name="keywords" content="Amazon, レビュー, ガジェット, 日用品, 買ってよかった, ブログ">

  <meta property="og:title" content="Gadget & Life All Hail Amazon｜Amazon購入品レビュー特化ブログ">
  <meta property="og:description" content="Amazonで実際に購入した商品の本音レビューを掲載。ガジェット・日用品・ファッションなど幅広く紹介。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hiiro-last.github.io/">
  <meta property="og:image" content="og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gadget & Life All Hail Amazon">
  <meta name="twitter:description" content="Amazon購入品レビュー特化ブログ。すべて自腹購入・実体験ベース。">
  <meta name="twitter:image" content="og-image.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Gadget & Life All Hail Amazon",
    "url": "https://hiiro-last.github.io/",
    "description": "Amazon購入品レビュー特化ブログ。ガジェット・日用品・ファッションなどを自腹購入でレビュー。",
    "publisher": {
      "@type": "Person",
      "name": "Hiro"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ▼▼▼ ヘッダー（TOPリンク化 & 右下にTOP表記） ▼▼▼ -->
<header style="position:relative;">
  <a href="index.html" style="color:white; text-decoration:none;">
    Gadget & Life All Hail Amazon
  </a>

  <span style="
    position:absolute;
    right:0;
    bottom:0;
    font-size:12px;
    color:#ccc;
  ">TOP</span>

  <div style="font-size:14px; margin-top:6px; color:#ddd;">
    ※本ブログは管理人が<strong>自腹で購入・実際に体験したものだけ</strong>を掲載しています。
  </div>
</header>
<!-- ▲▲▲ ヘッダーここまで ▲▲▲ -->

<nav>
  <a href="#" data-category="gadget">ガジェット</a>
  <a href="#" data-category="daily">日用品</a>
  <a href="#" data-category="other">ファッション</a>
  <a href="#" data-category="admin">管理人特製記事</a>
</nav>

<section id="articles"></section>

<!-- ▼▼▼ フッター（TOPリンク化 & 右下にTOP表記） ▼▼▼ -->
<footer style="background:#000; color:#fff; text-align:center; padding:20px 0; margin-top:40px; position:relative;">
  <a href="index.html" style="color:white; text-decoration:none; font-size:18px;">
    Gadget & Life All Hail Amazon
  </a>

  <span style="
    position:absolute;
    right:10px;
    bottom:5px;
    font-size:12px;
    color:#ccc;
  ">TOP</span>
</footer>
<!-- ▲▲▲ フッターここまで ▲▲▲ -->

<script>
  const jsonUrl = "articles.json?v=" + Date.now();

  fetch(jsonUrl)
    .then(res => res.json())
    .then(data => {
      const section = document.getElementById("articles");
      const navLinks = document.querySelectorAll("nav a");

      let currentCategory = "gadget";

      navLinks.forEach(link => {
        if (link.dataset.category === currentCategory) {
          link.classList.add("active");
        } else {
          link.classList.remove("active");
        }
      });

      function renderArticles() {
        section.innerHTML = "";

        const filtered = data.filter(article => article.category === currentCategory);

        if (filtered.length === 0) {
          section.innerHTML = "<p>このカテゴリの記事はまだありません。</p>";
          return;
        }

        filtered.forEach(article => {
          const card = document.createElement("div");
          card.className = "article-card";

          card.innerHTML = `
            <a href="https://www.amazon.co.jp" target="_blank">
              <img src="${article.thumb}" alt="${article.title}">
            </a>
            <div class="article-meta">購入日：${article.purchaseDate}</div>
            <h2>${article.title}</h2>
            <p>${article.description}</p>
          `;

          card.addEventListener("click", (e) => {
            if (e.target.tagName.toLowerCase() === "img") return;
            window.location.href = article.url;
          });

          section.appendChild(card);
        });
      }

      navLinks.forEach(link => {
        link.addEventListener("click", e => {
          e.preventDefault();
          navLinks.forEach(a => a.classList.remove("active"));
          link.classList.add("active");
          currentCategory = link.dataset.category;
          renderArticles();
        });
      });

      renderArticles();
    });
</script>

</body>
</html>
