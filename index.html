<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gadget & Life News</title>
  <link rel="stylesheet" href="style.css?v=1001">
</head>
<body>

<header>
  Gadget & Life News
  <div style="font-size:14px; margin-top:6px; color:#555;">
    ※本ブログは管理人が<strong>自腹で購入・実際に体験したものだけ</strong>を掲載しています。
  </div>
</header>

<nav>
  <a href="#" data-category="gadget">ガジェット</a>
  <a href="#" data-category="daily">日用品</a>
  <a href="#" data-category="other">ファッション</a>
  <a href="#" data-category="admin">管理人特製記事</a>
</nav>

<section id="articles"></section>

<script>
  // ★ JSON と index のキャッシュを完全破壊
  const jsonUrl = "articles.json?v=" + Date.now();

  fetch(jsonUrl)
    .then(res => res.json())
    .then(data => {
      const section = document.getElementById("articles");
      const navLinks = document.querySelectorAll("nav a");

      // ★ 初期表示カテゴリ：ガジェット
      let currentCategory = "gadget";

      // ★ 初期状態でガジェットタブを active にする
      navLinks.forEach(link => {
        if (link.dataset.category === currentCategory) {
          link.classList.add("active");
        } else {
          link.classList.remove("active");
        }
      });

      function renderArticles() {
        section.innerHTML = "";

        const filtered = data.filter(article => article.category === currentCategory);

        if (filtered.length === 0) {
          section.innerHTML = "<p>このカテゴリの記事はまだありません。</p>";
          return;
        }

        filtered.forEach(article => {
          const card = document.createElement("div");
          card.className = "article-card";

          card.innerHTML = `
            <a href="https://www.amazon.co.jp" target="_blank">
              <img src="${article.thumb}" alt="${article.title}">
            </a>
            <div class="article-meta">購入日：${article.purchaseDate}</div>
            <h2>${article.title}</h2>
            <p>${article.description}</p>
          `;

          card.addEventListener("click", (e) => {
            if (e.target.tagName.toLowerCase() === "img") return;
            window.location.href = article.url;
          });

          section.appendChild(card);
        });
      }

      navLinks.forEach(link => {
        link.addEventListener("click", e => {
          e.preventDefault();
          navLinks.forEach(a => a.classList.remove("active"));
          link.classList.add("active");
          currentCategory = link.dataset.category;
          renderArticles();
        });
      });

      renderArticles();
    });
</script>

</body>
</html>
